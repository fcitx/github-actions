name: 'Build and install with cmake'

inputs:
  path:
    description: 'Path to source code'
  install-prefix:
    description: 'Install prefix'
    default: '/opt/fcitx'
  cmake-option:
    description: 'Cmake option'
    default: ''
  shell:
    description: 'Shell'
    default: bash

runs:
  using: composite
  steps:
    - name: Configure
      shell: ${{ inputs.shell }}
      run: |
        cmake -G Ninja -S "${{ inputs.path }}" -B "${{ inputs.path }}/build" ${{ inputs.cmake-option }} -DCMAKE_INSTALL_PREFIX="${{ inputs.install-prefix }}"
    - name: Build
      shell: ${{ inputs.shell }}
      run: |
        cmake --build "${{ inputs.path }}/build" -j
    - name: Install
      shell: ${{ inputs.shell }}
      run: |
        cmake --install "${{ inputs.path }}/build"

